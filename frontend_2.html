<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pantry - 冰箱管家</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .card { margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .badge-emergency { background-color: #dc3545; }
    </style>
</head>
<body>

<div class="container">
    <h1 class="text-center mb-4">🍎 Smart Pantry 冰箱管家</h1>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header bg-primary text-white">新增食材</div>
                <div class="card-body">
                    <form id="addForm">
                        <div class="mb-2">
                            <label class="form-label">食材名稱</label>
                            <input type="text" id="ingName" class="form-control" required placeholder="例如: 雞蛋">
                        </div>
                        <div class="mb-2">
                            <label class="form-label">分類</label>
                            <input type="text" id="ingCategory" class="form-control" required placeholder="例如: 蛋奶類">
                        </div>  
                        <div class="mb-2">
                            <label class="form-label">數量</label>
                            <input type="number" id="qty" class="form-control" step="0.1" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">單位</label>
                            <input type="text" id="unit" class="form-control" placeholder="個/克" required>
                        </div>
                        <div class="mb-2">
                            <label class="form-label">過期日期</label>
                            <input type="date" id="expDate" class="form-control" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">放入冰箱</button>
                    </form>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-warning text-dark">✨ 智慧食譜推薦 (貪婪演算法)</div>
                <div class="card-body" id="smartRecommendList">
                    <p class="text-muted">點擊下方按鈕獲取清庫存建議</p>
                </div>
                <div class="card-footer">
                    <button class="btn btn-outline-dark btn-sm w-100" onclick="getSmartRecommend()">執行演算法</button>
                </div>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                    目前冰箱清單
                    <button class="btn btn-light btn-sm" onclick="loadInventory()">重新整理</button>
                </div>
                <div class="card-body">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>食材</th>
                                <th>數量</th>
                                <th>過期日</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="inventoryTable">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="card">
                <div class="card-header bg-info text-white">所有食譜</div>
                <div class="card-body">
                    <div id="allRecipeList" class="row"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">✏️ 修改食材資訊</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editId">
                <div class="mb-3">
                    <label class="form-label">修改名稱</label>
                    <input type="text" id="editName" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">修改分類</label>
                    <input type="text" id="editCategory" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">修改數量</label>
                    <input type="number" id="editQty" class="form-control" step="0.1" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">修改單位</label>
                    <input type="text" id="editUnit" class="form-control" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">修改過期日</label>
                    <input type="date" id="editExpDate" class="form-control" required>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                <button type="button" class="btn btn-primary" onclick="submitEdit()">儲存修改</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_BASE = "http://127.0.0.1:8000/api";
    let editModalInstance;

    // ✨ 幫助解析 FastAPI 驗證錯誤訊息的函數，徹底告別 [object Object]
    function formatError(detail) {
        if (Array.isArray(detail)) {
            // FastAPI 的錯誤陣列，把它整理成 "欄位名稱: 錯誤原因" 的格式
            return detail.map(err => `[欄位 ${err.loc[err.loc.length - 1]}] : ${err.msg}`).join('\n');
        } else if (typeof detail === 'object' && detail !== null) {
            return JSON.stringify(detail, null, 2);
        }
        return detail || "未知錯誤";
    }

    // 1. 取得冰箱清單
    async function loadInventory() {
        try {
            const res = await fetch(`${API_BASE}/inventory`);
            const result = await res.json();
            const tbody = document.getElementById('inventoryTable');
            tbody.innerHTML = '';
            
            if (result.data) {
                result.data.forEach(item => {
                    // 修正點：在這裡把 id, name, category, quantity, unit, expire_date 總共 6 個參數完整傳入
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.name} <small class="text-muted">(${item.category})</small></td>
                            <td>${item.quantity} ${item.unit}</td>
                            <td>${item.expire_date}</td>
                            <td>
                                <button class="btn btn-primary btn-sm me-1" 
                                    onclick="openEditModal(${item.id}, '${item.name}', '${item.category}', ${item.quantity}, '${item.unit}', '${item.expire_date}')">
                                    編輯
                                </button>
                                <button class="btn btn-danger btn-sm" onclick="deleteItem(${item.id})">刪除</button>
                            </td>
                        </tr>
                    `;
                });
            }
        } catch (error) {
            console.error("載入清單失敗:", error);
        }
    }

    // 2. 新增食材
    document.getElementById('addForm').onsubmit = async (e) => {
        e.preventDefault();
        const data = {
            name: document.getElementById('ingName').value,
            category: document.getElementById('ingCategory').value,
            quantity: parseFloat(document.getElementById('qty').value),
            unit: document.getElementById('unit').value,
            expire_date: document.getElementById('expDate').value
        };

        try {
            const res = await fetch(`${API_BASE}/inventory`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();

            if (res.ok) {
                alert(result.message || "新增成功！"); 
                document.getElementById('addForm').reset(); 
                loadInventory(); 
            } else {
                // 使用我們新寫的錯誤解析函數
                alert("新增失敗：\n" + formatError(result.detail));
            }
        } catch (error) {
            alert("連線失敗，請檢查後端是否開啟");
        }
    };

    // 3. 刪除食材
    async function deleteItem(id) {
        if (!confirm('確定要移除這項食材嗎？')) return;
        try {
            const res = await fetch(`${API_BASE}/inventory/${id}`, { method: 'DELETE' });
            if (res.ok) {
                loadInventory();
            }
        } catch (error) {
            alert("刪除失敗");
        }
    }

    // 開啟編輯視窗
    function openEditModal(id, name, category, quantity, unit, expireDate) {
        document.getElementById('editId').value = id;
        document.getElementById('editName').value = name;          
        document.getElementById('editCategory').value = category;  
        document.getElementById('editQty').value = quantity;
        document.getElementById('editUnit').value = unit;
        document.getElementById('editExpDate').value = expireDate;
        
        if (!editModalInstance) {
            editModalInstance = new bootstrap.Modal(document.getElementById('editModal'));
        }
        editModalInstance.show();
    }

    // 將修改後的資料送到後端
    async function submitEdit() {
        const id = document.getElementById('editId').value;
        const data = {
            name: document.getElementById('editName').value,          
            category: document.getElementById('editCategory').value,  
            quantity: parseFloat(document.getElementById('editQty').value),
            unit: document.getElementById('editUnit').value,
            expire_date: document.getElementById('editExpDate').value
        };

        try {
            const res = await fetch(`${API_BASE}/inventory/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();

            if (res.ok) {
                alert(result.message || "修改成功！");
                editModalInstance.hide(); 
                loadInventory();          
            } else {
                // 使用我們新寫的錯誤解析函數
                alert("修改失敗：\n" + formatError(result.detail));
            }
        } catch (error) {
            alert("連線失敗，請檢查後端是否開啟");
        }
    }

    // 4. 智慧推薦 (演算法)
    async function getSmartRecommend() {
        const res = await fetch(`${API_BASE}/recipes/smart-recommend`);
        const result = await res.json();
        const div = document.getElementById('smartRecommendList');
        div.innerHTML = '';

        if (!result.data || result.data.length === 0) {
            div.innerHTML = '<p class="text-success">太棒了！目前沒有即將過期的食材。</p>';
            return;
        }

        result.data.forEach(r => {
            div.innerHTML += `
                <div class="mb-3 border-bottom pb-2">
                    <strong>🍴 ${r.recipe_name}</strong>
                    <span class="badge badge-emergency float-end">清掉 ${r.emergency_count} 樣</span>
                    <br><small class="text-muted">${r.description || ''}</small>
                </div>
            `;
        });
    }

    // 5. 取得所有食譜
    async function loadRecipes() {
        try {
            const res = await fetch(`${API_BASE}/recipes/recommend`);
            const result = await res.json();
            const div = document.getElementById('allRecipeList');
            div.innerHTML = '';
            
            if (result.data) {
                result.data.forEach(r => {
                    let ingText = r.ingredients.map(i => `${i.item} ${i.qty}${i.unit}`).join(', ');
                    div.innerHTML += `
                        <div class="col-md-6 mb-2">
                            <div class="p-2 border rounded bg-white">
                                <h6>${r.name}</h6>
                                <small class="text-muted">材料：${ingText}</small>
                            </div>
                        </div>
                    `;
                });
            }
        } catch (error) {
            console.error("載入食譜失敗:", error);
        }
    }

    // 初始載入
    loadInventory();
    loadRecipes();
</script>

</body>
</html>
